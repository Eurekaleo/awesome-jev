<svg class="hero-svg" viewBox="0 0 760 640" xmlns="http://www.w3.org/2000/svg" focusable="false">
  <defs>
    <linearGradient id="hg-fade" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#9bd7d3" stop-opacity="0"/><stop offset="1" stop-color="#9bd7d3" stop-opacity=".55"/></linearGradient>
    <radialGradient id="hg-glow" cx=".62" cy=".42" r=".6"><stop offset="0" stop-color="#1d2a33"/><stop offset="1" stop-color="#0f1219" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="760" height="640" fill="url(#hg-glow)"/>
  <!-- probability simplex, faint -->
  <g class="hg-simplex" stroke="#9bd7d3" stroke-opacity=".10" fill="none">
    <path d="M410 612 L700 110 L740 612 Z"/>
    <path d="M458 529 L707 529 M506 446 L714 446 M555 363 L721 363 M603 280 L727 280 M652 196 L733 196"/>
    <path d="M458 612 L707 181 M506 612 L714 253 M555 612 L721 326 M603 612 L727 398 M652 612 L733 470"/>
  </g>
  <g class="hg-points">
    <circle cx="611" cy="492" r="3" fill="#9bd7d3" fill-opacity=".35"/><circle cx="648" cy="455" r="3" fill="#9bd7d3" fill-opacity=".35"/>
    <circle cx="590" cy="560" r="3" fill="#9bd7d3" fill-opacity=".3"/><circle cx="676" cy="338" r="3" fill="#9bd7d3" fill-opacity=".3"/>
    <circle cx="700" cy="248" r="4.5" fill="#f39a57" class="hg-pulse"/>
  </g>

  <!-- state card -->
  <g class="hg-state" transform="translate(28 96)">
    <rect width="232" height="196" rx="16" fill="#161b24" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="20" y="32" class="hg-mono">state</text>
    <text x="206" y="32" class="hg-mono hg-dim" text-anchor="end">{ }</text>
    <rect x="20" y="52" width="148" height="7" rx="3.5" fill="#ffffff" fill-opacity=".20"/>
    <rect x="20" y="70" width="186" height="7" rx="3.5" fill="#ffffff" fill-opacity=".13"/>
    <rect x="20" y="88" width="120" height="7" rx="3.5" fill="#ffffff" fill-opacity=".13"/>
    <rect x="36" y="112" width="160" height="7" rx="3.5" fill="#9bd7d3" fill-opacity=".30"/>
    <rect x="36" y="130" width="102" height="7" rx="3.5" fill="#ffffff" fill-opacity=".13"/>
    <rect x="36" y="148" width="136" height="7" rx="3.5" fill="#ffffff" fill-opacity=".13"/>
    <rect x="20" y="170" width="84" height="7" rx="3.5" fill="#ffffff" fill-opacity=".10"/>
  </g>

  <!-- connectors state -> questions -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="1.4">
    <path d="M260 160 C 300 160, 300 92, 336 92"/>
    <path d="M260 196 C 300 196, 300 262, 336 262"/>
    <path d="M260 232 C 292 232, 292 432, 336 432"/>
  </g>
  <g fill="none" stroke="#f39a57" stroke-width="1.6" class="hg-flow">
    <path d="M260 160 C 300 160, 300 92, 336 92"/>
  </g>

  <!-- typed questions -->
  <g class="hg-q" transform="translate(336 72)">
    <rect width="104" height="40" rx="20" fill="#10131b" stroke="#f39a57" stroke-opacity=".75"/>
    <text x="52" y="25" text-anchor="middle" class="hg-mono hg-accent">choice</text>
  </g>
  <g class="hg-q" transform="translate(336 242)">
    <rect width="104" height="40" rx="20" fill="#10131b" stroke="#9bd7d3" stroke-opacity=".6"/>
    <text x="52" y="25" text-anchor="middle" class="hg-mono">score</text>
  </g>
  <g class="hg-q" transform="translate(336 412)">
    <rect width="104" height="40" rx="20" fill="#10131b" stroke="#9bd7d3" stroke-opacity=".6"/>
    <text x="52" y="25" text-anchor="middle" class="hg-mono">noul</text>
  </g>

  <!-- choice: distribution over declared options -->
  <g transform="translate(478 32)">
    <path d="M0 110 H200" stroke="#ffffff" stroke-opacity=".22"/>
    <rect class="hg-bar" x="8" y="22" width="30" height="88" rx="4" fill="#f39a57"/>
    <rect class="hg-bar" x="56" y="78" width="30" height="32" rx="4" fill="#9bd7d3" fill-opacity=".55"/>
    <rect class="hg-bar" x="104" y="94" width="30" height="16" rx="4" fill="#9bd7d3" fill-opacity=".45"/>
    <rect class="hg-bar" x="152" y="101" width="30" height="9" rx="4" fill="#9bd7d3" fill-opacity=".38"/>
    <path d="M0 44 H200" stroke="#f39a57" stroke-width="1.3" stroke-opacity=".9"/>
    <text x="204" y="48" class="hg-mono hg-accent hg-small">τ</text>
    <text x="8" y="130" class="hg-mono hg-dim hg-small">A</text><text x="56" y="130" class="hg-mono hg-dim hg-small">B</text>
    <text x="104" y="130" class="hg-mono hg-dim hg-small">C</text><text x="152" y="130" class="hg-mono hg-dim hg-small">D</text>
  </g>

  <!-- score: ordered levels -->
  <g transform="translate(478 214)">
    <path d="M0 76 H200" stroke="#ffffff" stroke-opacity=".22"/>
    <rect class="hg-bar" x="20" y="60" width="30" height="16" rx="4" fill="#9bd7d3" fill-opacity=".45"/>
    <rect class="hg-bar" x="86" y="22" width="30" height="54" rx="4" fill="#9bd7d3" fill-opacity=".7"/>
    <rect class="hg-bar" x="152" y="46" width="30" height="30" rx="4" fill="#9bd7d3" fill-opacity=".55"/>
    <path d="M35 94 H167" stroke="#ffffff" stroke-opacity=".3"/>
    <circle cx="35" cy="94" r="3" fill="#ffffff" fill-opacity=".45"/><circle cx="101" cy="94" r="3" fill="#ffffff" fill-opacity=".45"/><circle cx="167" cy="94" r="3" fill="#ffffff" fill-opacity=".45"/>
    <path d="M114 86 l6 10 h-12 z" fill="#f39a57" transform="translate(0 2)"/>
  </g>

  <!-- noul: probability of yes -->
  <g transform="translate(478 418)">
    <rect x="0" y="8" width="200" height="14" rx="7" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".15"/>
    <rect class="hg-fill" x="0" y="8" width="164" height="14" rx="7" fill="url(#hg-fade)"/>
    <circle cx="164" cy="15" r="7" fill="#10131b" stroke="#9bd7d3" stroke-width="2"/>
    <text x="0" y="46" class="hg-mono hg-dim hg-small">p(yes)</text>
  </g>

  <!-- gate and outcomes -->
  <g fill="none" stroke-width="1.5">
    <path d="M696 142 C 730 170, 734 470, 690 520" stroke="#ffffff" stroke-opacity=".14"/>
    <path d="M578 488 C 578 520, 560 540, 520 552" stroke="#f39a57" stroke-opacity=".8"/>
    <path d="M630 488 C 640 520, 660 540, 690 552" stroke="#9bd7d3" stroke-opacity=".7"/>
  </g>
  <g transform="translate(544 470)">
    <rect width="120" height="32" rx="8" fill="#161b24" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="60" y="21" text-anchor="middle" class="hg-mono hg-small">confidence ≥ τ ?</text>
  </g>
  <g transform="translate(424 540)">
    <rect width="96" height="34" rx="17" fill="#f39a57"/>
    <text x="48" y="22" text-anchor="middle" class="hg-mono hg-ink">act</text>
  </g>
  <g transform="translate(662 540)">
    <rect width="92" height="34" rx="17" fill="none" stroke="#9bd7d3"/>
    <text x="46" y="22" text-anchor="middle" class="hg-mono">escalate</text>
  </g>
</svg>
